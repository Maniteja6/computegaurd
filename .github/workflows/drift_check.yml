name: Drift check and auto-retrain

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6am UTC
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check drift summary exists
        run: |
          if [ -f "monitoring/reports/drift_summary.json" ]; then
            python -c "
          import json
          with open('monitoring/reports/drift_summary.json') as f:
              s = json.load(f)
          print(f'Drift share    : {s[\"drift_share\"]:.2%}')
          print(f'Retrain needed : {s[\"retrain_needed\"]}')
            "
          else
            echo "No drift summary found — skipping drift evaluation"
          fi

      - name: Run alerts check
        run: |
          if [ -f "monitoring/reports/drift_summary.json" ]; then
            python monitoring/alerts.py
          fi

      - name: Summary
        run: echo "Drift check workflow complete"